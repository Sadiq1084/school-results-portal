<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>School Results Portal</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f7f6;
  color:#222;
}

header{
  background:#087f5b;
  color:white;
  text-align:center;
  padding:25px;
}

header h1{
  margin-bottom:10px;
}

.container{
  width:90%;
  max-width:1000px;
  margin:30px auto;
}

.card{
  background:white;
  padding:25px;
  border-radius:12px;
  margin-bottom:20px;
  box-shadow:0 3px 12px rgba(0,0,0,0.1);
}

h2,h3{
  color:#087f5b;
  margin-bottom:15px;
}

input{
  width:100%;
  padding:12px;
  margin-bottom:15px;
  border:1px solid #ccc;
  border-radius:7px;
  font-size:16px;
}

button{
  width:100%;
  padding:13px;
  background:#087f5b;
  color:white;
  border:none;
  border-radius:7px;
  cursor:pointer;
  font-size:16px;
}

button:hover{
  background:#056b4d;
}

.result-card{
  margin-top:20px;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}

th,td{
  border:1px solid #ddd;
  padding:10px;
  text-align:center;
}

th{
  background:#087f5b;
  color:white;
}

.summary{
  margin-top:20px;
  background:#e9f7f1;
  padding:15px;
  border-radius:8px;
}

footer{
  background:#073b2b;
  color:white;
  text-align:center;
  padding:20px;
  margin-top:40px;
}

@media(max-width:600px){
 table{
  font-size:12px;
 }
}
</style>

</head>

<body>

<header>
<h1>School Results Portal</h1>
<p>Student Academic Results Management System</p>
</header>


<div class="container">

<div class="card">
<h2>Welcome</h2>
<p>
Check your academic results using your Student ID.
</p>
</div>


<div class="card">

<h3>Check Your Result</h3>

<input 
type="text" 
id="studentId"
placeholder="Enter Student ID e.g. STU001">

<button onclick="checkResult()">
Check Result
</button>

<div id="message"></div>

</div>

</div>


<footer>
<p>© 2026 School Results Portal</p>
<p>NextGen Software Development Capstone Project</p>
</footer>


<script>

const students={

"STU001":{
name:"Aisha Ibrahim",
className:"SS2",
session:"2025/2026",

subjects:[
["English",25,60],
["Mathematics",28,58],
["Biology",26,62],
["Chemistry",24,55],
["Physics",27,59]
]

},

"STU002":{
name:"Mohammed Musa",
className:"SS2",
session:"2025/2026",

subjects:[
["English",22,52],
["Mathematics",24,48],
["Biology",27,57],
["Chemistry",21,50],
["Physics",25,54]
]

}

};


function grade(total){

if(total>=70) return ["A","Excellent"];
if(total>=60) return ["B","Very Good"];
if(total>=50) return ["C","Good"];
if(total>=45) return ["D","Fair"];
if(total>=40) return ["E","Pass"];

return ["F","Fail"];

}


function checkResult(){

let id=document.getElementById("studentId").value.toUpperCase();

let student=students[id];

let output=document.getElementById("message");


if(!student){

output.innerHTML="<p style='color:red;margin-top:15px;'>Student not found. Try STU001</p>";

return;

}


let rows="";
let totalMarks=0;


student.subjects.forEach(subject=>{

let total=subject[1]+subject[2];

let result=grade(total);

totalMarks+=total;


rows+=`

<tr>

<td>${subject[0]}</td>

<td>${subject[1]}</td>

<td>${subject[2]}</td>

<td>${total}</td>

<td>${result[0]}</td>

<td>${result[1]}</td>

</tr>

`;

});


let average=(totalMarks/student.subjects.length).toFixed(2);


output.innerHTML=`

<div class="card result-card">

<h2>Student Result</h2>

<p><b>Name:</b> ${student.name}</p>

<p><b>Class:</b> ${student.className}</p>

<p><b>Session:</b> ${student.session}</p>


<table>

<tr>
<th>Subject</th>
<th>CA</th>
<th>Exam</th>
<th>Total</th>
<th>Grade</th>
<th>Remark</th>
</tr>

${rows}

</table>


<div class="summary">

<p><b>Total Marks:</b> ${totalMarks}</p>

<p><b>Average:</b> ${average}%</p>

</div>


</div>

`;

}

</script>

</body>
</html>
